<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/_7_CSS_Unites/style.css">
    <title>CSS Unites</title>
</head>
<body>
    <h1>Percantage</h1>
    <div class="parent">
        <h6>Child</h6>
        <div class="child"></div>
    </div>

    <h1>Viewport</h1>
    <div class="container">
        <h6>Child</h6>
        <div class="sub-container"></div>
    </div>

    <h1>Pixcel</h1>
    <div class="pixel-parent">
        <h6>Child</h6>
        <div class="pixel-child"></div>
    </div>

    <h1>Em</h1>
    <div class="em-parent">
    
        <div class="em-child">I am child</div>
    </div>

    <h1>Rem</h1>
    <div class="rem-unit">
        This is a rem unit example.
    </div>
</body>
</html>
