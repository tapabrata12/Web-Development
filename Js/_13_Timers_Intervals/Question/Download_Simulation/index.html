<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Minimal Download Bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="download">
    <p>Download</p>
    <div class="bar">
      <div id="progress"></div>
    </div>
    <div id="percent">0%</div>
  </div>

  <div class="controls">
    <button id="inc">Start</button>
    <button id="dec">Stop</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
