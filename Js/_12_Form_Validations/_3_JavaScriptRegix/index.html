<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap");
      * {
        margin: 0;
        padding: 0;
        font-family: "Outfit", sans-serif;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background-color: #222;
        color: white;
      }
      #submit {
        padding: 5px;
        cursor: pointer;
      }
      small {
        color: red;
        display: none;
      }
    </style>
    <title>Document</title>
  </head>
  <body>
    <form action="">
      <label for="form-validation"><h1>Form validation</h1></label> <br />
      <br />
      <!-- Inline Validation and pattern attribute-->
      <input type="text" placeholder="username" id="name" required /> <br />
      <small>Your name should be greater than 2 charecters</small>
      <br />
      <select id="gender">
        <br />
        <br />
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="others">Others</option>
      </select>
      <br />
      <br />
      <input required type="email" placeholder="email" id="eml" /><br />
      <br />
      <input type="password" placeholder="password" /><br />
      <br />

      <label for="form-validation">Tell me about yourself</label> <br />
      <br />
      <textarea
        placeholder="Tell me about yourself"
        rows="3"
        cols="50"
      ></textarea>
      <br />
      <br />
      <input type="submit" value="Submit" id="submit" />
    </form>
    <script src="script.js"></script>
  </body>
</html>
