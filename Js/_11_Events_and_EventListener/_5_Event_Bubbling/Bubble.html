<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
*{
    margin: 0;
    padding: 0;
    font-family: "Outfit", sans-serif;
    box-sizing: border-box;
}

html,body{
    width: 100%;
    height: 100%;
    background-color: #222;
}

#main{
    display: flex;
    width: 600px;
    height: 600px;
    border: 2px solid white;
}

.div1{
    width: 500px;
    height: 500px;
    border: 2px solid rgb(214, 208, 17);
}

.div2{
    width: 400px;
    height: 400px;
    border: 2px solid rgb(26, 229, 202);
}

.div3{
    width: 300px;
    height: 300px;
    border: 2px solid rgb(214, 3, 95);
    
}

button{
    cursor: pointer;
    padding: 5px;
    background-color: bisque;
    position: relative;
    top: 50%;
    left: 20%;
}

ul{
    border: 2px solid white;
    color: white;
}
.line{
    text-decoration: line-through;
}
    </style>
    <title>Event Bubbling and capturing</title>
</head>
<body>

    <main id="main">
        <div class="div1">
            <div class="div2">
                <div class="div3">
                    <button>Click to see Event Bubbling</button>
                </div>
            </div>
        </div>
    </main>

    <ul>
        <li>Home</li>
        <li>About</li>
        <li>Services</li>
        <li>Contact</li>
    </ul>
    <script src="Bubble.js"></script>
</body>
</html>
