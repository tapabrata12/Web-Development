<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap");
      * {
        margin: 0;
        padding: 0;
        font-family: "Outfit", sans-serif;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background-color: #222;
      }
      #abcd {
        width: 400px;
        height: 400px;
        background-color: red;
        cursor: pointer;
      }
    </style>
    <title>Prevent Default</title>
  </head>
  <body>
    <!--  e is called event object: We will get all the information about the event that occurred
    'click' This is event type, What type of event we want to perform -->
    <div id="abcd"></div>

    <form>
      <input type="email" placeholder="Email" />
      <input type="password" placeholder="Password" />
      <input id="submit" type="submit" value="Submit" />
    </form>

    <script src="PreventDefault.js"></script>
  </body>
</html>
