<!DOCTYPE html>
<html>
<head>
    <title>Third Table</title>
</head>
<body>
    <h1>Third Table</h1>
    <p>Table with rowspan and colspan</p>
    <table border="1">
        <thead>
           <th>Heading 1</th>
           <th>Heading 2</th>
           <th>Heading 3</th>
           <th>Heading 4</th>
           <th>Heading 5</th>
        </thead>
        <tbody>
            <tr>
                <td>Row 1 Col 1</td>
                <td>Row 1 Col 2</td>
                <td>Row 1 Col 3</td>
                <td>Row 1 Col 4</td>
                <td rowspan="3">Row 1 Col 5</td>
            </tr>
            <tr>
                <td>Row 2 Col 1</td>
                <td>Row 2 Col 2</td>
                <td>Row 2 Col 3</td>
                <td>Row 2 Col 4</td>
            </tr>
            <tr>
                <td>Row 3 Col 1</td>
                <td>Row 3 Col 2</td>
                <td>Row 3 Col 3</td>
                <td>Row 3 Col 4</td>
            </tr>
            <tr>
                <td colspan="3">Row 4 Col 1</td>
                <td>Row 4 Col 2</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
