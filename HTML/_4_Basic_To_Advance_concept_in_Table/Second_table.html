<!DOCTYPE html>
<html>
<head>
    <title>Table With Row & Column Span</title>
</head>
<body>
    <h1>Table With Row & Column Span</h1>
    <a href="https://cdn.educba.com/academy/wp-content/uploads/2019/10/Create-Tables-in-HTML.png">See the table reference</a> <hr>  <!-- hr tag for line break -->
    <table border="2">
        <tr>
            <td>Column 1</td>
            <td>Column 2</td>
            <td>Column 3</td>
        </tr>
        <tr>
            <td rowspan="2">Row 1 Cel 1</td>
            <td>Row 1 Cel 2</td>
            <td>Row 1 cel 3</td>
        </tr>
        <tr>
            <td>Row 2 Cell 2</td>
            <td>Row 2 Cell 3</td>
        </tr>
        <tr>
            <td colspan="3">Row 3 Cel 1</td>
        </tr>
    </table>
</body>
</html>
