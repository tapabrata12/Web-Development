<!DOCTYPE html>
<html>
<head>
    <title>HTML Forms</title>
</head>
<form>
    <body>
        <h1>HTML simple login form</h1>
        <label for="email">Enter your name: </label>
        <input type="email" id="email">
        <br>
        <br>
        <label for="pass">Enter your password: </label>
        <input type="password" id="pass">
        <!-- Making button using input tag -->
         <br>
         <br>
        <input type="submit" value="Submit">
        <!-- Making button using button tag -->
         <button>Click Here</button>
    </form>

    <h1>Placeholder Example</h1>
    <form >
        <label for="plc">User name:</label>
        <input type="text" id="plc" placeholder="Ex: Ramesh Kumar">
    </form>

    <h1>Various kind of form elements</h1>
    <form >
        <!-- Input element -->
         <label for="date">Date picker</label>
         <input type="date" id="date">
            <br>
        <!-- Select and Option Tag -->
         <select name="" id=""></select>
    </form>
</body>
</html>
