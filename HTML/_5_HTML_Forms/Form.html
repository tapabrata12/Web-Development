<!DOCTYPE html>
<html>
<head>
    <title>HTML Forms</title>
</head>
<form>
    <body>
        <h1>HTML simple login form</h1>
        <label for="email">Enter your name: </label>
        <input type="email" id="email">
        <br>
        <br>
        <label for="pass">Enter your password: </label>
        <input type="password" id="pass">
        <!-- Making button using input tag -->
         <br>
         <br>
        <input type="submit" value="Submit">
        <!-- Making button using button tag -->
         <button>Click Here</button>
    </form>

    <h1>Placeholder Example</h1>
    <form >
        <label for="plc">User name:</label>
        <input type="text" id="plc" placeholder="Ex: Ramesh Kumar">
    </form>

    <h1>Various kind of form elements</h1>
    <fieldset>
        <legend>Form Elements</legend>
        <form >
            <!-- Input element -->
             <label for="date">Date picker</label>
             <input type="date" id="date">
                <br>
                <br>
            <!-- Select and Option Tag -->
    
            <label for="Dropdown">Option Tag</label>
             <select name="Dropdown" id="Dropdown">
                <option value="O0">-- Select Option --</option>
                <option value="O1">Option 1</option>
                <option value="O2">Option 2</option>
                <option value="O3">Option 3</option>
             </select>
    
             <!-- Textarea Tag -->
                <br>
                <br>
                <textarea name="textar" id="ta" rows="5" cols="50">Enter something</textarea>
    
                <!-- Button -->
                <br>
                <br>
                <button id="btn">Click Me</button>
        </form>
    </fieldset>
</body>
</html>
